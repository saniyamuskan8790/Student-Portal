<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
</head>
<body>

<h1>Student Login</h1>

<form method="POST">
    {% csrf_token %}

    <label>Username:</label><br>
    <input type="text" name="username"><br><br>

    <label>Password:</label><br>
    <input type="password" name="password"><br><br>

    <input type="submit" value="Login">

</form>

</body>
</html>
